[project]
name = "rednote-pilot"
version = "0.1.0"
description = "AI 控制红米 Note 11 Pro 的助手：ADB + LLM + 文件管理 + 技能系统"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff"]

[project.scripts]
rednote-pilot = "rednote_pilot.cli:main"

[project.entry-points."rednote_pilot.skills"]
builtin = "rednote_pilot.skills:SkillRegistry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rednote_pilot*"]

[tool.ruff]
line-length = 110
target-version = "py310"
