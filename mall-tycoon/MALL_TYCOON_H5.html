<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0e1730">
<title>商场大亨</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0e1730;color:#eef;
           overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
  #app{max-width:720px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
       display:flex;flex-direction:column;gap:10px;height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .hud{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .chip{background:#1b2b52;border-radius:10px;padding:8px 12px;font-size:14px}
  .chip b{color:#ffd75a;font-size:16px}
  #barWrap{flex:1;height:10px;background:#0a0f22;border-radius:5px;overflow:hidden;min-width:110px}
  #bar{height:100%;width:0%;background:linear-gradient(90deg,#37a3ff,#8ce6a0);transition:width .2s}
  button{cursor:pointer;border:0;border-radius:10px;padding:8px 14px;font-size:14px;background:#37a3ff;color:#04122b;font-weight:600}
  button:active{transform:scale(.97)}
  button.ghost{background:#1b2b52;color:#cfe0ff}
  button:disabled{opacity:.4;cursor:not-allowed}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .tipbar{font-size:12px;color:#8fa3d0}
  .eventbar{border-radius:10px;padding:6px 10px;font-size:13px}
  .eventbar.good{background:#1f4d30;color:#8ce6a0}
  .eventbar.bad{background:#4d1f1f;color:#ff9f9f}
  #goalBar{position:relative;height:22px;background:#0a0f22;border-radius:8px;overflow:hidden}
  #goalFill{height:100%;width:0%;background:linear-gradient(90deg,#ffd75a,#8ce6a0);transition:width .3s}
  #goalText{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;text-shadow:0 1px 2px #000}
  #winBanner{background:linear-gradient(135deg,#ffd75a,#ff9a3c);color:#3a2a00;border-radius:14px;
             padding:12px 16px;font-weight:700;display:none;animation:winpop .6s;font-size:14px}
  @keyframes winpop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
  #grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  #gridWrap{position:relative}
  #cusLayer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:40}
  .cus{position:absolute;font-size:16px;pointer-events:none;transition:left .9s ease-in-out,top .9s ease-in-out,opacity .4s;
       filter:drop-shadow(0 1px 2px rgba(0,0,0,.5));z-index:41;transform:translate(-50%,-50%);opacity:1}
  #liveChip{background:#0a2a1a;border:1px solid #2f6f4f;border-radius:10px;padding:4px 10px;font-size:13px;color:#8ce6a0;display:none}
  #liveChip.neg{background:#2a0a0a;border-color:#6f2f2f;color:#ff9f9f}
  #achPanel{background:#1b2b52;border-radius:14px;padding:12px;display:none}
  #onboard{background:#10182f;border:2px solid #3a4f86;border-radius:14px;padding:16px;display:none}
  #achPanel h3{color:#ffd75a;font-size:15px;margin-bottom:8px}
  .ach{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;border-radius:8px;margin-bottom:4px;font-size:13px;background:#14203f}
  .ach .done{color:#8ce6a0;font-weight:700}
  .ach .undone{color:#7f8db0}
  .ach.unlocked{background:#1f4d30}
  .ach.unlocked .name{color:#8ce6a0}
  .achToast{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99;
            background:linear-gradient(135deg,#ffd75a,#ff9a3c);color:#3a2a00;font-weight:700;
            padding:10px 18px;border-radius:12px;font-size:14px;box-shadow:0 4px 16px rgba(0,0,0,.4);
            animation:toastIn 3s ease forwards}
  @keyframes toastIn{0%{opacity:0;transform:translateX(-50%) translateY(-20px)}10%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-10px)}}
  .slot{aspect-ratio:1;border-radius:12px;background:#22305c;padding:8px;display:flex;flex-direction:column;
        justify-content:space-between;cursor:pointer;user-select:none;position:relative;overflow:hidden;min-height:84px}
  .slot .name{font-size:15px;font-weight:700}
  .slot .sub{font-size:12px;opacity:.85;line-height:1.3}
  .slot.empty{background:#182545;border:2px dashed #3a4f86}
  .slot.empty .name{color:#7f95c9}
  .slot.locked{background:#10182f !important;border:2px dashed #2a3a5f}
  .slot.locked .name{color:#5a6a94}
  .slot .lv{position:absolute;top:6px;right:8px;font-size:12px;background:#ffd75a;color:#3a2a00;
            padding:1px 6px;border-radius:8px;font-weight:700}
  .slot .flash{position:absolute;inset:0;background:rgba(255,215,90,.25);opacity:0;pointer-events:none}
  .slot.flash .flash{animation:fl .5s}
  @keyframes fl{0%{opacity:1}100%{opacity:0}}
  .float{position:fixed;font-size:18px;font-weight:700;color:#8ce6a0;pointer-events:none;

        transform:translate(-50%,-50%);animation:fu 1.4s ease-out forwards;z-index:50}
  .float.neg{color:#ff8f8f}
  @keyframes fu{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-140%)}}
   #report{background:#1b2b52;border-radius:14px;padding:14px;display:none}
  #report h3{color:#ffd75a;margin-bottom:8px;font-size:16px}
  #report .row{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
  #report .pos{color:#8ce6a0}#report .neg{color:#ff8f8f}
  .cus{position:absolute;font-size:14px;pointer-events:none;transition:left .8s linear,top .8s linear;
       filter:drop-shadow(0 1px 1px rgba(0,0,0,.5));z-index:30}
</style>
</head>
<body>
<div id="app">
  <div class="hud">
    <div class="chip">资金 <b id="money">¥0</b></div>
    <div class="chip">第 <b id="day">1</b> 天</div>
    <div id="barWrap"><div id="bar"></div></div>
    <button id="endDay">结束今天</button>
  </div>
  <div class="toolbar">
    <button class="ghost" id="save">存档</button>
    <button class="ghost" id="reset">重开</button>
    <button class="ghost" id="unlock">🔓 扩建 <span id="unlockCost"></span></button>
    <button class="ghost" id="achBtn">🏅 成就</button>
    <button class="ghost" id="sndBtn">🔊</button>
    <span class="tipbar" id="tip">点击空地建铺 | 点击铺位升级 | 长按2秒拆除</span>
  </div>
  <div class="eventbar" id="eventbar" style="display:none"></div>
  <div id="goalBar"><div id="goalFill"></div><span id="goalText"></span></div>
  <div id="liveChip" style="display:none"></div>
  <div id="winBanner"></div>
  <div id="onboard" style="display:none">
    <div style="font-size:18px;font-weight:700;color:#ffd75a;margin-bottom:8px">👋 欢迎接手这家商场</div>
    <div style="font-size:14px;line-height:1.7;color:#cfe0ff">
      1️⃣ 点击空地建铺,开起来就有客流进账<br>
      2️⃣ 点击已开铺位升级(每级更贵、客流更多)<br>
      3️⃣ 攒到 ¥20,000 点「🔓 扩建」开放最右列,能建精品酒店<br>
      4️⃣ 每天 30 秒自动结算,留意「📈 今日实时」与随机事件<br>
      5️⃣ 攒到 ¥100,000 即达成扩张成功 🏆
    </div>
    <button id="onboardOk" style="margin-top:12px">开始经营</button>
  </div>
  <div id="achPanel" style="display:none"></div>
  <div id="gridWrap">
    <div id="grid"></div>
    <div id="cusLayer"></div>
  </div>
  <div id="report">
    <h3 id="reportTitle">第 1 天 财报</h3>
    <div class="row"><span>顾客</span><span id="rCust"></span></div>
    <div class="row"><span>收入</span><span id="rInc" class="pos"></span></div>
    <div class="row"><span>维护费</span><span id="rExp" class="neg"></span></div>
    <div class="row"><span>结余</span><span id="rNet"></span></div>
  </div>
</div>
<script>
// Mall Tycoon — 核心逻辑(与 Unity 版同构)
"use strict";

const SHOPS = {
  Cafe:       { name:"咖啡厅", build:1500, upBase:1000, perCustomer:8,   upkeep:50,  maxLevel:5, attract:4, color:"#8b5a2b" },
  Supermarket:{ name:"超市",   build:3000, upBase:2000, perCustomer:15,  upkeep:120, maxLevel:5, attract:6, color:"#2e7d32" },
  Gaming:     { name:"游戏厅", build:5000, upBase:3500, perCustomer:25,  upkeep:250, maxLevel:5, attract:9, color:"#1565c0" },
  Cinema:     { name:"电影院", build:9000, upBase:5000, perCustomer:40,  upkeep:500, maxLevel:5, attract:14, color:"#6a1b9a" },
  Hotel:      { name:"精品酒店", build:18000,upBase:10000,perCustomer:70, upkeep:1200,maxLevel:5, attract:20, color:"#00838f" },
};
const GRID_W = 4, GRID_H = 3;
const GRID_LOCKED_COLS = 1;   // 最右一列需解锁
const UNLOCK_COST = 20000;
const DAY_LEN_SEC = 30;
const GOAL_MONEY = 100000;     // 达成即"扩张成功"

const state = {
  money: 20000,
  day: 1,
  dayTime: 0,
  gridUnlocked: false,
  eventToday: null,
  peakMoney: 20000,
  maxLevelReached: 0,
  achievements: [],
  slots: Array.from({length:GRID_W*GRID_H}, () => ({
    built:false, type:null, level:0, customersToday:0, revenueToday:0
  })),
};

// ---- 成就定义(在 UI 层展示,核心层判定) ----
const ACHIEVEMENTS = [
  { id:"a_first", name:"开张营业", desc:"建起第 1 家铺位",
    check:s=>s.slots.some(x=>x.built) },
  { id:"a_ten",   name:"百货商场", desc:"同时开满 10 家铺位",
    check:s=>s.slots.filter(x=>x.built).length>=10 },
  { id:"a_maxed", name:"旗舰店铺", desc:"把任意铺位升到 Lv5",
    check:s=>s.slots.some(x=>x.built&&x.level>=5) },
  { id:"a_expand",name:"城市地标", desc:"完成扩建并解锁最右列",
    check:s=>s.gridUnlocked },
  { id:"a_50k",   name:"小有名气", desc:"资金达到 ¥50,000",
    check:s=>s.peakMoney>=50000 },
  { id:"a_100k",  name:"扩张成功", desc:"资金达到 ¥100,000",
    check:s=>s.peakMoney>=100000 },
  { id:"a_10day", name:"长期经营", desc:"经营满 10 天",
    check:s=>s.day>=11 },
];
function checkAchievements(){
  // 在 endDay / build / upgrade / unlock 后调用,返回新解锁的成就
  const newly=[];
  for(const a of ACHIEVEMENTS){
    if(state.achievements.includes(a.id))continue;
    if(a.check(state)){ state.achievements.push(a.id); newly.push(a); }
  }
  return newly;
}

function slotAt(x,y){ const i=y*GRID_W+x; return (i<0||i>=state.slots.length)?null:state.slots[i]; }

function isCellLocked(x){ return (x===GRID_W-1 && !state.gridUnlocked); }

function attractivity(){
  let s=20;
  for(const sl of state.slots){
    if(sl.built){ s += SHOPS[sl.type].attract * sl.level; }
  }
  return s;
}
function dailyCustomers(){ return Math.max(0, Math.round(Math.sqrt(attractivity())*40)); }

function eventWobble(){
  if(!state.eventToday) return 1;
  return state.eventToday === "good" ? 1.5 : (state.eventToday === "bad" ? 0.5 : 1);
}

function customersPerHour(sl){
  if(!sl.built) return 0;
  const def=SHOPS[sl.type];
  return Math.round(def.attract * sl.level * 1.5 * eventWobble());
}

function rollDailyEvent(){
  const r=Math.random();
  if(r<0.15) state.eventToday="good";      // 周末促销
  else if(r<0.30) state.eventToday="bad";  // 商场检修
  else state.eventToday=null;              // 平常
  return state.eventToday;
}

function tickDay(){
  // 按小时把客流分摊到铺位
  for(const sl of state.slots){
    const c = customersPerHour(sl);
    if(c<=0) continue;
    const share = Math.round(c * (0.85 + Math.random()*0.3));
    sl.customersToday += share;
    sl.revenueToday += share * SHOPS[sl.type].perCustomer;
  }
}

function endDay(){
  let income=0, expense=0, customers=0;
  for(const sl of state.slots){
    if(!sl.built) continue;
    const def=SHOPS[sl.type];
    income += sl.revenueToday;
    expense += def.upkeep;
    customers += sl.customersToday;
    sl.customersToday=0; sl.revenueToday=0;
  }
  state.money += income - expense;
  if(state.money>state.peakMoney)state.peakMoney=state.money;
  state.day++;
  state.dayTime=0;
  state.eventToday=null;
  const report={ day:state.day-1, customers, income, expense };
  rollDailyEvent(); // 预抽明天事件
  return report;
}

function unlockGrid(){
  if(state.gridUnlocked) return false;
  if(state.money<UNLOCK_COST) return false;
  state.money-=UNLOCK_COST; state.gridUnlocked=true; return true;
}

function buildAt(x,y){
  const sl=slotAt(x,y); if(!sl||sl.built) return false;
  if(isCellLocked(x)) return false;
  // 按顺序买得起哪个建哪个
  for(const key of Object.keys(SHOPS)){
    const def=SHOPS[key];
    if(state.money>=def.build){
      state.money-=def.build;
      sl.built=true; sl.type=key; sl.level=1;
      return true;
    }
  }
  return false;
}
function upgradeAt(x,y){
  const sl=slotAt(x,y); if(!sl||!sl.built) return false;
  const def=SHOPS[sl.type];
  if(sl.level>=def.maxLevel) return false;
  const cost=def.upBase*sl.level;
  if(state.money<cost) return false;
  state.money-=cost; sl.level++; return true;
}
function demolishAt(x,y){
  const sl=slotAt(x,y); if(!sl||!sl.built) return false;
  state.money += Math.floor(SHOPS[sl.type].build/2);
  sl.built=false; sl.type=null; sl.level=0; sl.customersToday=0; sl.revenueToday=0;
  return true;
}

function goalReached(){ return state.money>=GOAL_MONEY; }
function totalBuilt(){ return state.slots.filter(s=>s.built).length; }

function save(){ localStorage.setItem("mall_tycoon_save", JSON.stringify(state)); }
function load(){
  const raw=localStorage.getItem("mall_tycoon_save");
  if(!raw) return false;
  try{ const s=JSON.parse(raw);
        Object.assign(state, s);
        if(state.gridUnlocked===undefined) state.gridUnlocked=false;
        if(s.eventToday===undefined) state.eventToday=null;
        if(s.peakMoney===undefined) state.peakMoney=state.money;
        if(s.maxLevelReached===undefined) state.maxLevelReached=0;
        if(!Array.isArray(s.achievements)) state.achievements=[];
        return true; }catch(e){ return false; }
}
function resetSave(){ localStorage.removeItem("mall_tycoon_save"); Object.assign(state,{
  money:20000, day:1, dayTime:0, gridUnlocked:false, eventToday:null,
  peakMoney:20000, maxLevelReached:0, achievements:[],
  slots:Array.from({length:GRID_W*GRID_H},()=>({built:false,type:null,level:0,customersToday:0,revenueToday:0}))
}); }

</script>
<script>
// ---- UI 层 ----
const grid=document.getElementById('grid');
const cusLayer=document.getElementById('cusLayer');
const $=id=>document.getElementById(id);
const fmt=n=>'¥'+Math.round(n).toLocaleString('zh-CN');
let _slotEls=[]; // renderGrid 维护的槽位元素数组(与 slotAt 索引对应),供客流/顾客动画复用

function renderGrid(){
  grid.innerHTML='';
  _slotEls=[];
  for(let y=GRID_H-1;y>=0;y--){
    for(let x=0;x<GRID_W;x++){
      const sl=slotAt(x,y);
      const d=document.createElement('div');
      const locked=isCellLocked(x) && !sl.built;
      d.className='slot '+((sl.built?'':'empty')+(locked?' locked':''));
      d.dataset.x=x; d.dataset.y=y;
      const def=sl.built?SHOPS[sl.type]:null;
      d.style.background=sl.built?def.color+'55':'#182545';
      // 不用嵌套模板字符串,逐段拼接
      let sub = locked ? ('¥'+UNLOCK_COST+' 解锁后可建')
        : (sl.built
          ? ('L'+sl.level+' 客'+sl.customersToday+' 售'+fmt(sl.revenueToday)+' 维护'+fmt(def.upkeep))
          : '点击建造');
      let lvHtml = sl.built ? ('<div class="lv">Lv'+sl.level+'</div>') : '';
      let nameHtml = locked ? '🔒' : (def?def.name:'空地');
      d.innerHTML =
        '<div class="name">'+nameHtml+'</div>' +
        '<div class="sub">'+sub+'</div>' +
        lvHtml +
        '<div class="flash"></div>';
      // 交互
      let pressT=null,longFired=false,pressTimer=null;
      let demolishRef=0;
      d.addEventListener('pointerdown',e=>{
        pressT=Date.now(); longFired=false;
        demolishRef=sl.built?Math.floor(SHOPS[sl.type].build/2):0;
        pressTimer=setTimeout(()=>{
          if(longFired)return;
          longFired=true;
          if(demolishAt(x,y)){ save(); sDemo(); floatNum(d,'+'+fmt(demolishRef),false); renderAll(); setTip('已拆除,返还 50% 建造费'); }
        },2000);
      });
      const cancel=()=>{ clearTimeout(pressTimer); };
      d.addEventListener('pointerup',e=>{
        clearTimeout(pressTimer);
        if(longFired)return;
        if(isCellLocked(x) && !sl.built){ setTip('该铺位未解锁,点上方「扩建」按钮开放最右一列'); cancel(); return; }
        if(!sl.built){
          if(buildAt(x,y)){ save(); const builtDef=SHOPS[sl.type]; floatNum(d,'-'+fmt(builtDef.build),true); flash(d); sBuild(); renderAll(); setTip('已建造 '+builtDef.name); checkAndShowAch(); }
          else setTip('资金不足,无法建造'+(totalBuilt()>=0?'':''));
        }else{
          const d2=SHOPS[sl.type];
          if(sl.level>=d2.maxLevel){ setTip('已满级'); }
          else{
            const cost=d2.upBase*sl.level;
            if(state.money<cost){ setTip('升级需 '+fmt(cost)+',资金不足'); }
            else{ upgradeAt(x,y); save(); floatNum(d,'-'+fmt(cost),true); flash(d); sUpgrade(); renderAll(); setTip(d2.name+' 升到 Lv'+sl.level); checkAndShowAch(); }
          }
        }
        cancel();
      });
      d.addEventListener('pointerleave',cancel);
      grid.appendChild(d);
      _slotEls.push(d); // 与 slotAt(x,y) 下标一致(y 外 x 内)
    }
  }
}
function flash(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'),500); }
function floatNum(el,text,neg){
  if(!el)return;
  const r=el.getBoundingClientRect();
  const f=document.createElement('div');
  f.className='float'+(neg?' neg':'');
  f.textContent=text;
  f.style.left=(r.left+r.width/2)+'px';
  f.style.top=(r.top+r.height/2)+'px';
  document.body.appendChild(f);
  setTimeout(()=>f.remove(),1400);
}
function setTip(t){ $('tip').textContent=t; }

function renderAll(){
  $('money').textContent=fmt(state.money);
  $('day').textContent=state.day;
  renderGrid();
  renderEventBar(); renderGoal(); renderWin(); renderLive(); renderAch();
  $('unlockCost').textContent=state.gridUnlocked?'(已解锁)':'¥'+UNLOCK_COST;
  $('unlock').disabled=state.gridUnlocked;
}
function renderAch(){
  const p=$('achPanel');
  if(p.style.display==='none')return;
  p.innerHTML='';
  const h=document.createElement('h3'); h.textContent='成就 ('+state.achievements.length+'/'+ACHIEVEMENTS.length+')'; p.appendChild(h);
  for(const a of ACHIEVEMENTS){
    const done=state.achievements.includes(a.id);
    const row=document.createElement('div');
    row.className='ach'+(done?' unlocked':'');
    const name=document.createElement('div');
    name.className=done?'done':'undone';
    name.textContent=(done?'✅ ':'🔒 ')+a.name+' — '+a.desc;
    row.appendChild(name);
    p.appendChild(row);
  }
}
function toastAch(a){
  const t=document.createElement('div');
  t.className='achToast';
  t.textContent='🏅 成就达成:'+a.name;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
function checkAndShowAch(){
  const newly=checkAchievements();
  if(newly.length){ save(); newly.forEach(a=>toastAch(a)); sUpgrade(); renderAch(); }
  return newly;
}
function renderEventBar(){
  const eb=$('eventbar');
  if(state.eventToday==='good'){ eb.style.display='block'; eb.className='eventbar good'; eb.textContent='🎉 今日周末促销!客流 ×1.5'; }
  else if(state.eventToday==='bad'){ eb.style.display='block'; eb.className='eventbar bad'; eb.textContent='🔧 今日商场检修,客流 ×0.5'; }
  else { eb.style.display='none'; eb.textContent=''; }
}
function renderGoal(){
  const pct=Math.min(100,state.money/GOAL_MONEY*100);
  $('goalFill').style.width=pct+'%';
  $('goalText').textContent='扩张目标 '+fmt(state.money)+' / '+fmt(GOAL_MONEY);
}
function renderWin(){
  const w=$('winBanner');
  if(goalReached()){
    w.style.display='block';
    w.textContent='🏆 达成!资金突破 '+fmt(GOAL_MONEY)+'(第 '+state.day+' 天)— 你的商场已成为城市地标。继续经营或重开新档。';
  } else w.style.display='none';
}
function showReport(r){
  $('reportTitle').textContent='第 '+r.day+' 天 财报';
  $('rCust').textContent=r.customers+' 人';
  $('rInc').textContent='+'+fmt(r.income);
  $('rExp').textContent='-'+fmt(r.expense);
  const net=r.income-r.expense;
  const el=$('rNet');
  el.textContent=(net>=0?'+':'')+fmt(net);
  el.className=net>=0?'pos':'neg';
  $('report').style.display='block';
}

// ---- 音效(Web Audio,零依赖;首次交互时启动) ----
let AC=null, soundOn=true;
function beep(freq,dur=0.06,type='sine',vol=0.04){
  if(!soundOn)return;
  try{
    if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.value=vol;o.connect(g);g.connect(AC.destination);
    o.start();o.stop(AC.currentTime+dur);
  }catch(e){}
}
function sBuild(){ beep(520,0.07,'square'); setTimeout(()=>beep(780,0.08,'square'),70); }
function sUpgrade(){ beep(660,0.05,'triangle'); setTimeout(()=>beep(880,0.07,'triangle'),60); }
function sDemo(){ beep(300,0.12,'sawtooth',0.03); }
function sCash(){ beep(1320,0.05,'sine',0.03); setTimeout(()=>beep(1760,0.06,'sine',0.03),50); }
function sWin(){ [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,0.12,'triangle',0.05),i*120)); }

// ---- 顾客小人(纯 DOM,按小时客流分批进场,走到开着的铺位消费后进账) ----
const CUS_EMOJI=['🧑','👩','🧔','👧','🕴','🧕','👴','👵'];
function spawnCustomers(count){
  const built=[];
  for(let i=0;i<_slotEls.length;i++){
    const el=_slotEls[i]; const sl=slotAt(+el.dataset.x,+el.dataset.y);
    if(sl&&sl.built)built.push({el,sl});
  }
  if(!built.length)return;
  const gr=grid.getBoundingClientRect();
  const lyr=cusLayer.getBoundingClientRect();
  for(let i=0;i<Math.min(count,6);i++){
    const c=document.createElement('div');
    c.className='cus';
    c.textContent=CUS_EMOJI[Math.floor(Math.random()*CUS_EMOJI.length)];
    // 从左侧进场,走向随机一家开着的铺位
    const pick=built[Math.floor(Math.random()*built.length)];
    const target=pick.el; const tr=target.getBoundingClientRect();
    c.style.left='0px';
    c.style.top=(Math.random()*0.5+0.25)*gr.height+'px';
    cusLayer.appendChild(c);
    const tx=tr.left-lyr.left+tr.width/2, ty=tr.top-lyr.top+tr.height/2;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ c.style.left=tx+'px'; c.style.top=ty+'px'; }));
    // 走到铺位后 0.6s:"消费"——弹 +¥ 浮字 + 轻闪铺位,然后淡出离场
    setTimeout(()=>{
      if(pick.sl.built){
        const price=SHOPS[pick.sl.type].perCustomer;
        floatNum(target,'+'+fmt(price),false);
        flash(target);
      }
    },950);
    setTimeout(()=>{ c.style.opacity='0'; c.style.top=String(+c.style.top*0.2||0); },1650);
    setTimeout(()=>c.remove(),2200);
  }
}
function renderLive(){
  const built=[]; let inc=0,exp=0,cust=0;
  for(const sl of state.slots){
    if(!sl.built)continue;
    const d=SHOPS[sl.type];
    inc+=sl.revenueToday; exp+=d.upkeep; cust+=sl.customersToday;
    if(sl.built)built.push(sl);
  }
  const net=inc-exp;
  const lc=$('liveChip');
  if(built.length===0){ lc.style.display='none'; return; }
  lc.style.display='inline-block';
  lc.className=''; if(net<0)lc.classList.add('neg');
  lc.textContent='📈 今日实时: '+cust+' 人 · 已收 '+fmt(inc)+' / 维护 '+fmt(exp)+' · 预计结余 '+(net>=0?'+':'')+fmt(net);
}

// 时间推进
let acc=0, last=performance.now(), lastHour=0;
function loop(t){
  const dt=(t-last)/1000; last=t;
  if(state.dayTime<1){
    acc+=dt;
    // 每小时(DAY_LEN_SEC/24)分摊一次客流:用 floor 计数,不扣减 acc
    const hourStep=DAY_LEN_SEC/24;
    const hour=Math.floor(acc/hourStep);
    if(hour>lastHour && hour<24){
      lastHour=hour;
      tickDay();
      spawnCustomers(3+Math.floor(Math.random()*4)); // 顾客进场动画
      // 客流只更新格子副标题,不重建整格 DOM(避免打断按住的指针)
      for(let i=0;i<_slotEls.length;i++){
        const el=_slotEls[i];
        const cx=+el.dataset.x, cy=+el.dataset.y;
        const sl=slotAt(cx,cy);
        const sub=el.querySelector('.sub');
        if(sub && sl && sl.built){
          const def=SHOPS[sl.type];
          sub.textContent='L'+sl.level+' 客'+sl.customersToday+' 售'+fmt(sl.revenueToday)+' 维护'+fmt(def.upkeep);
        }
      }
      renderLive();
    }
    state.dayTime=Math.min(1,acc/DAY_LEN_SEC);
  }
  $('bar').style.width=(state.dayTime*100).toFixed(1)+'%';
  $('money').textContent=fmt(state.money);
  if(state.dayTime>=1){
    const r=endDay();
    save();
    showReport(r);
    renderEventBar();
    sCash();
    if(goalReached())sWin();
    acc=0; lastHour=0;  // 新一天的时间从零开始
    renderAll();
    checkAndShowAch();
  }
  requestAnimationFrame(loop);
}

$('endDay').onclick=()=>{
  if(state.dayTime>=1)return;
  const r=endDay(); save(); showReport(r); renderEventBar(); sCash(); renderAll(); checkAndShowAch();
};
$('save').onclick=()=>{ save(); setTip('已存档'); };
$('reset').onclick=()=>{ if(confirm('确定重开?')){ resetSave(); save(); rollDailyEvent(); renderAll(); setTip('已重开'); } };
$('unlock').onclick=()=>{
  if(state.gridUnlocked){ setTip('扩建已完成'); return; }
  if(unlockGrid()){ save(); sUpgrade(); floatNum($('unlock'),'-'+fmt(UNLOCK_COST),true); renderAll(); setTip('已解锁最右一列新铺位'); checkAndShowAch(); }
  else setTip('资金不足,扩建需 '+fmt(UNLOCK_COST));
};
$('sndBtn').onclick=()=>{
  soundOn=!soundOn;
  $('sndBtn').textContent=soundOn?'🔊':'🔇';
  setTip(soundOn?'音效开':'音效关');
};
$('achBtn').onclick=()=>{
  const p=$('achPanel');
  if(p.style.display==='block'){ p.style.display='none'; return; }
  p.style.display='block';
  renderAch();
};

// 建铺/升级/拆除音效钩子(在 SlotController 的交互处已有 setTip,这里用事件委托补音效)
grid.addEventListener('pointerup',()=>{ /* 建铺/升级的实际调用在下方,直接在那处加 beep */ });

// 初始化
load(); rollDailyEvent(); renderAll();
// 首次游玩(无存档)显示引导浮层
if(!load() && state.day===1 && state.achievements.length===0){
  document.getElementById('onboard').style.display='block';
}
document.getElementById('onboardOk').onclick=()=>{
  document.getElementById('onboard').style.display='none';
  setTip('开始经营,先建一家铺位吧!');
};
// 手机触屏:阻止双指缩放与双击放大
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
requestAnimationFrame(t=>{ last=t; requestAnimationFrame(loop); });
</script>
